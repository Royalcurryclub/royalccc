backend:
  name: git-gateway
  branch: main

# Editor uploads media into wp-content/uploads (matches existing structure)
media_folder: "wp-content/uploads"
public_folder: "/wp-content/uploads"

# Show plain commit messages, not "Updated config files" etc.
display_url: https://royalccc.net
site_url: https://royalccc.net
logo_url: https://royalccc.net/assets/img/favicon-512.png

collections:

  # ============================================================
  # 1. WRITE A REVIEW
  # ============================================================
  - name: "posts"
    label: "✍️ Write a Review"
    label_singular: "Review"
    description: >
      Add a new monthly review. Fill in the fields, write the review in the body,
      and click Publish. The review will appear on the site within ~1 minute.
    folder: "_posts"
    create: true
    delete: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["title", "date"]
    view_filters:
      - label: "This year"
        field: date
        pattern: "2026"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Format: 'Month Year – Restaurant & Bar'. Example: 'July 2025 – Saket & Bailies Bar'. Use an en-dash (–) not a hyphen (-)."

      - label: "Publish date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD'T'HH:mm:ssZ"
        date_format: "DD MMM YYYY"
        time_format: false
        picker_utc: false
        hint: "Today's date is fine. This is when the review goes live, not when the meet happened (the meet date comes from the title)."

      - label: "Address"
        name: "address"
        widget: "string"
        required: false
        hint: "The curry restaurant's street address. Example: '222 St Asaph St'. Optional but adds a Google Maps link at the end of the review."

      - label: "Service score (out of 5)"
        name: "service"
        widget: "string"
        required: false
        pattern: ['^[0-5](\.[0-9])?$', "Must be a number from 0 to 5, optionally with one decimal place. Examples: 4, 4.5, 0.0"]
        hint: "Optional. Examples: 4, 4.5, 5"

      - label: "Curry score (out of 5)"
        name: "curry"
        widget: "string"
        required: false
        pattern: ['^[0-5](\.[0-9])?$', "Must be a number from 0 to 5, optionally with one decimal place. Examples: 4, 4.5, 0.0"]
        hint: "Optional. Examples: 4, 4.5, 5"

      - label: "Review body"
        name: "body"
        widget: "markdown"
        hint: >
          Write the review here. Use the Rich Text editor for everything except
          tables (rare). The Service/Curry/Total scores will be added at the
          bottom automatically — you don't need to write them in the body.

      # Hidden fields that are always the same
      - { label: "Author", name: "author", widget: "hidden", default: "RoyalCCC Reviewer" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Categories", name: "categories", widget: "hidden", default: ["Reviews"] }

  # ============================================================
  # 2. UPDATE THE TABLES
  # ============================================================
  - name: "data"
    label: "📋 Update Tables"
    description: "Add or edit rows in the Visitations and Scores on the Doors tables."
    files:

      - label: "Visitations table"
        name: "visitations"
        file: "_data/visitations.yml"
        description: >
          The full record of every monthly meet. Click the table below, then click "Add visitations" at the
          bottom to add a new row. Fill in the fields and Save. Don't worry about ordering —
          new rows go at the bottom and are automatically the most recent.
        fields:
          - label: "Visitations"
            name: "visitations"
            widget: "list"
            label_singular: "visitation"
            summary: "{{fields.sitting}} – {{fields.when}} – {{fields.curry}}"
            fields:
              - { label: "Sitting #", name: "sitting", widget: "string", hint: "Just a number, increment by 1 from the last row. Example: '140'" }
              - { label: "When", name: "when", widget: "string", hint: "Format: 'Mon YYYY'. Example: 'May 2026'. For Annual Outings: 'Nov 2026 Annual Outing'" }
              - { label: "Curry establishment", name: "curry", widget: "string", hint: "Just the restaurant name. Example: 'Saket'" }
              - { label: "Where", name: "where", widget: "string", hint: "Street address. Example: '76 Edgeware Rd'" }
              - { label: "Before/After drinks", name: "drinks", widget: "string", hint: "Just the bar name. Example: 'Bailies Bar'" }

      - label: "Scores on the Doors"
        name: "scores"
        file: "_data/scores.yml"
        description: >
          Service / food / total scores for each visit. Click the table below, then click "Add scores" at the
          top to insert a new row at the top (newest first). Fill in the fields and Save. The "Review URL" can stay
          blank if there's no review yet — the page will just show plain text instead of a clickable link.
        fields:
          - label: "Score rows (newest at top)"
            name: "scores"
            widget: "list"
            label_singular: "score"
            summary: "{{fields.when}} – {{fields.visitation}} ({{fields.total}}/10)"
            fields:
              - { label: "When", name: "when", widget: "string", hint: "Format: 'Mon-YY' (note the dash and 2-digit year). Example: 'Jul-25'" }
              - { label: "Visitation", name: "visitation", widget: "string", hint: "Restaurant & Bar combined. Example: 'Saket & Bailies Bar'" }
              - { label: "Review URL", name: "review_url", widget: "string", required: false, hint: "Optional. The URL slug of the matching review post. Example: '/july-2025-saket-bailies-bar/'. Leave blank if no review exists yet." }
              - { label: "Service /5", name: "service", widget: "string", pattern: ['^[0-5](\.[0-9])?$', "Number from 0 to 5"], hint: "Example: 4.5" }
              - { label: "Food /5", name: "food", widget: "string", pattern: ['^[0-5](\.[0-9])?$', "Number from 0 to 5"], hint: "Example: 4.3" }
              - { label: "Total /10", name: "total", widget: "string", pattern: ['^([0-9]|10)(\.[0-9])?$', "Number from 0 to 10"], hint: "Example: 8.8 (Service + Food)" }

  # ============================================================
  # 3. ADVANCED (rarely needed)
  # ============================================================
  - name: "static_pages"
    label: "⚙️ Site pages (rarely changed)"
    description: "Edit the Welcome message and Contact page. The Splash page and other layouts are configured in code."
    files:

      - label: "Welcome page (the front page intro)"
        name: "home"
        file: "home.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "The Royal Curry Club of Christchurch" }
          - { label: "Welcome message", name: "body", widget: "markdown", hint: "The italic introduction paragraph at the top of the home page." }
          - { label: "Layout", name: "layout", widget: "hidden", default: "home" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/" }

      - label: "Contact page"
        name: "contact"
        file: "contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Contact" }
          - { label: "Page text + form", name: "body", widget: "markdown", hint: "Be careful editing this — the contact form HTML lives here. If unsure, leave it alone." }
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/contact/" }
