<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/classic.css" | relative_url }}">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ "/assets/img/favicon-192.png" | relative_url }}" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ "/assets/img/favicon-180.png" | relative_url }}">
  <meta property="og:image" content="{{ "/assets/img/favicon-512.png" | absolute_url }}">
  <meta name="theme-color" content="#6B1E1E">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</head>
